services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ballast-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ballast
    ports:
      - "5432:5432"
    volumes:
      - ballast-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ballast"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ballast-postgres-data:
